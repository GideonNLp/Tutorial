<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#F6F5FB" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14121E" media="(prefers-color-scheme: dark)">
    <title>Pagina nu a fost găsită · Page not found – CycleCare</title>
    <style>
      :root { color-scheme: light dark; --bg: #F6F5FB; --ink: #1F1B3A; --on-ink: #FFFFFF; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14121E; --ink: #F1EEF8; --on-ink: #14121E; } }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink);
        font: 1.0625rem/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 26rem; text-align: center; }
      .code { margin: 0; font-size: 0.9375rem; font-weight: 650; letter-spacing: 0.08em; opacity: 0.7; }
      h1 { margin: 0.5rem 0 0.75rem; font-size: 1.875rem; line-height: 1.15; letter-spacing: -0.01em; }
      p { margin: 0 0 1.5rem; }
      .en { margin-top: -0.75rem; opacity: 0.8; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 3rem; padding: 0.5rem 1.5rem;
        border-radius: 999px; background: var(--ink); color: var(--on-ink); font-weight: 650; text-decoration: none;
      }
      a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Eroare 404</p>
      <h1>Pagina nu a fost găsită</h1>
      <p>Adresa nu există sau a fost mutată. Datele tale din CycleCare nu sunt afectate: ele rămân pe dispozitivul tău.</p>
      <p class="en" lang="en">Page not found. This address doesn’t exist or has moved. Your CycleCare data is not affected: it stays on your device.</p>
      <a href="/Tutorial/">Deschide CycleCare · <span lang="en">Open</span></a>
    </main>
  </body>
</html>
