<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #14110f;
        --paper: #ffffff;
        --side-a: #ff5a1f;
        --side-b: #2f5bff;
        --yellow: #ffd43b;
        --mint: #29c79a;
        --slate: #8a8f98;
        --red: #e5383b;
        --font-display: "Archivo Black", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--yellow);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="68"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scenes: one per sentence of the script; the voice is the clock -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="4.4" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="9" data-duration="4.05" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="13.05" data-duration="7.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="20.85" data-duration="8.15" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="29" data-duration="5.55" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="34.55" data-duration="6.15" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s8" data-composition-id="s8" data-composition-src="compositions/s8.html" data-start="40.7" data-duration="7.85" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s9" data-composition-id="s9" data-composition-src="compositions/s9.html" data-start="48.55" data-duration="4.55" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s10" data-composition-id="s10" data-composition-src="compositions/s10.html" data-start="53.1" data-duration="6.45" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s11" data-composition-id="s11" data-composition-src="compositions/s11.html" data-start="59.55" data-duration="8.45" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <!-- Captions: every word of the voiceover, CapCut-style highlight -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="68" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- Voiceover (normalised to -16 LUFS) -->
      <audio id="vo" class="clip" src="assets/voiceover-norm.mp3" data-start="0" data-duration="66.73" data-track-index="3" data-volume="1"></audio>

      <!-- Sound effects: each one has a cause on screen; peak lands one frame after the picture -->
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="0.62" data-duration="0.57" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="2.64" data-duration="0.72" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.73" data-duration="0.57" data-track-index="4" data-volume="0.4" data-playback-rate="0.85"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="20.62" data-media-start="2.3" data-duration="0.7" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="14.72" data-duration="0.72" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sfx-click1" class="clip" src="assets/sfx/click-soft.mp3" data-start="28.95" data-duration="0.37" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-pop3" class="clip" src="assets/sfx/pop.mp3" data-start="39.76" data-duration="0.72" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/whoosh.mp3" data-start="48.4" data-duration="0.57" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-pop4" class="clip" src="assets/sfx/pop.mp3" data-start="51.6" data-duration="0.72" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-w5" class="clip" src="assets/sfx/whoosh.mp3" data-start="59.38" data-duration="0.57" data-track-index="4" data-volume="0.4" data-playback-rate="0.85"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="61.3" data-duration="3.0" data-track-index="6" data-volume="0.3" data-fade-in="0.6"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="64.24" data-duration="2.59" data-track-index="5" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
